server {
  listen 5173;
  server_name _;
  root /usr/share/nginx/html;

  # Hashed assets are immutable: a content change changes the filename, so a
  # stale one can never be served.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html points at the current asset hashes, so it must never be cached.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # Terminate the API on the same origin as the app. The browser never makes a
  # cross-origin request, so CORS is simply not part of the system.
  location /api/ {
    proxy_pass http://bff:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # The BFF degrades rather than failing, which means a slow upstream can
    # legitimately take its full timeout budget. Give it room instead of
    # returning a 504 that hides the degraded response we worked to produce.
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;

    # Correlation ids travel in both directions.
    proxy_set_header X-Correlation-Id $request_id;
    proxy_pass_header X-Correlation-Id;
  }

  # SPA fallback: any unknown path is a client route, not a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
